[package]
name = "shuangpin-practice"
version = "1.9.0"
description = "小鹤双拼打字练习器"
authors = ["kungco"]
license = "MIT"
edition = "2021"
# Tauri 2 要求的最低 Rust 版本（保守取值，实际更低也能编）
rust-version = "1.77"

[lib]
# main.rs 里调用的 `shuangpin_practice_lib::run()` 就是这个名字。
# crate-type 保留三种是 Tauri 模板的约定（静态库/动态库给移动端用，
# rlib 给桌面端用）—— 只做桌面的话留 rlib 也能编，但保持模板形状
# 以后想加移动端时不用改。
name = "shuangpin_practice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ---------------------------------------------------------------------------
# 这个 indexmap 不是我们要用的，它是一条**依赖链上的必要修正**，别删。
#
# 问题：`indexmap 1.x` 的 build.rs 用 autocfg 编译探测「sysroot 里有没有 std」
# 来决定是否 emit `has_std`；而这个 cfg 控制着
#     #[cfg(has_std)]      pub struct IndexMap<K, V, S = RandomState>
#     #[cfg(not(has_std))] pub struct IndexMap<K, V, S>
# —— 也就是 IndexMap 有没有那个默认类型参数。
#
# 探测一旦失败，`schemars 0.8.22`（tauri-build / tauri-utils 依赖它做配置校验）
# 里那句 `type Map<K, V> = indexmap::IndexMap<K, V>;` 就编译不过：
#     error[E0107]: struct takes 3 generic arguments but 2 were supplied
# 实测本机（rustup 的 x86_64-pc-windows-gnu）就会失败：
# `<sysroot>/lib` 下只有 rustlib/，libstd 在 lib/rustlib/<target>/lib/，
# autocfg 的探测拿不到，于是 has_std 没被 emit。
#
# 修法用的是 indexmap 作者自己留的后门 —— 它的 build.rs 第一行就是：
#     match env::var_os("CARGO_FEATURE_STD") {
#         Some(_) => autocfg::emit("has_std"),      // 显式开了 std 就不探测
#         None    => autocfg::new().emit_sysroot_crate("std"),
#     }
# 所以这里显式打开 std feature，探测这一步就被跳过，结果与正常环境一致
# （正常环境本来也会探测出 has_std=true）。
#
# 为什么放在 [build-dependencies]：出问题的 schemars 位于**构建期/过程宏**那一组
# 依赖里（tauri-build、tauri-codegen、tauri-macros 都是 host 侧），
# 而 resolver v2 下 host 与 target 两组的 feature 是分开统一的，放这里才对得上。
# ---------------------------------------------------------------------------
indexmap = { version = "1", features = ["std"] }

[dependencies]
# 本应用是纯静态站点：所有逻辑都在 WebView 里的 JS 中，
# 不调用任何 Rust 命令、不需要任何 Tauri 插件。
# 因此 features 留空 —— 每加一个 feature 都会把体积推上去。
tauri = { version = "2", features = [] }

# 发布版的体积优化。这几项对最终 .exe 大小影响明显，
# 正是换 Tauri 的目的所在，所以逐项说明：
#   lto + codegen-units=1  跨模块内联并去掉重复代码，编译慢但产物小
#   opt-level="s"          优化目标偏向体积（"z" 更极端，但可能拖慢启动）
#   panic="abort"          去掉 panic 展开表
#   strip                  丢掉符号表
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
